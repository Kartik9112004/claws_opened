version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claws_opened_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Mount codebase path internally. The agent running inside
      # this container will interact with the mounted workspace directory.
      - CODEBASE_PATH=/workspace
    volumes:
      # Mount your codebase from the host to the container.
      # Change the host path (./workspace) if you want the agent bot to manage a different directory.
      - ./workspace:/workspace
